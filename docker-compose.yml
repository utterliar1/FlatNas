version: "3.8"

services:
  flatnas:
    # 本仓库（定制版）的镜像由 CI 构建并发布到 GHCR，amd64/arm64 双架构：
    #   ghcr.io/utterliar1/flatnas:latest
    # 上游原版是 qdnas/flatnas（含 Docker 管理 / 宿主机监控，与本分支行为不同），
    # 请勿混用。
    image: ghcr.io/utterliar1/flatnas:latest
    container_name: flatnas
    restart: unless-stopped
    ports:
      - "23000:3000"
    volumes:
      - ./data:/app/server/data #指定路径下新建data
      - ./music:/app/server/music #映射播放器路径
      - ./PC:/app/server/PC #映射背景路径
      - ./APP:/app/server/APP #映射移动端背景路径
      - ./doc:/app/server/doc #映射文件传输助手路径
