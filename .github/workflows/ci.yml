name: CI

# 本仓库是 Garry-QD/FlatNas 的个人定制分支。本工作流只做两件事：
#   1) 在干净的 Linux 机器上构建 + 测试（backend / frontend 两个作业）
#   2) 测试全绿后，把完整镜像推送到 GHCR（docker 作业，needs 依赖上面两个）
#
# 为什么用 GHCR 而不是 Docker Hub：推 ghcr.io 只需内置的 GITHUB_TOKEN（permissions: packages: write），
# **不需要配置任何 secret**。原先的 docker-publish.yml / release.yml 指向 Docker Hub 的 qdnas/flatnas
# 并依赖 fork 里不存在的 DOCKERHUB_* secret（已于 268bd1a 删除）。
#
# GHCR 包已存在且为公开（匿名可拉），同时提供 linux/amd64 与 linux/arm64：
#   docker pull ghcr.io/utterliar1/flatnas:latest
#   docker pull ghcr.io/utterliar1/flatnas:sha-5f8b6dc
#
# ⚠️ 本文件被 .gitignore 第 167 行的 `.github` 规则忽略，改动后需 `git add -f` 才能提交。

on:
  push:
    branches: ["main"]
    tags: ["v*"]          # 打 vX.Y.Z 标签时额外产出语义化版本 tag
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# 连续推送时取消尚未跑完的旧运行，避免排队浪费 runner 分钟。
# 注意 PR 与 main 用不同 ref，互不干扰。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限：只需要读代码（docker 作业在 job 级单独提权）
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # 包含 handlers/merge_test.go —— 文档三方合并引擎的表驱动单测（33 项）
      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (Vue 3 + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 Dockerfile 的 node:24-bookworm-slim 保持同一大版本，避免「CI 绿、镜像里构建失败」
      # 这类环境漂移。Node 24 是当前 Active LTS；原先用 22.12.0，而镜像里是已 EOL 的 Node 20。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci 会在 package.json 与 lockfile 不同步时直接失败 —— 这正是我们要的
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --build

      # 用 npm test（= vitest run --environment=jsdom --no-file-parallelism），与本地基线同一口径。
      # 串行是为了确定性：本机 Windows 下文件级并行会随机静默丢 spec 文件（假绿），
      # 用同一命令可以让 CI 与本地得到可比较的结果（12 文件 / 154 passed / 2 skipped）。
      # 其中 i18n-keys.spec.ts 会断言已接线组件的模板里不得残留中文字面量，是防回退门禁。
      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx vite build

  docker:
    name: Docker (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 「测试绿了才发版本」由 needs 结构性保证 —— 上面两个作业任一失败，本作业根本不启动
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write    # 推 ghcr.io 所需；配合 GITHUB_TOKEN，无需任何 secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # linux/arm64 由 QEMU 模拟执行。因为 Dockerfile 里两个构建阶段都标了
      # --platform=$BUILDPLATFORM，真正走模拟的只有运行层的 apk add，开销很小。
      # 只想出 amd64 的话，删掉本步骤并把下面的 platforms 改回 linux/amd64 即可。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR 只验证 Dockerfile 还能不能构建，不登录、不推送
      - name: Log into ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名会被自动转小写（ghcr.io/utterliar1/flatnas）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 双架构：x86_64（爱快 / fnOS / 群晖）与 arm64（树莓派 / ARM NAS 均可直接拉）
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
